# Toda credencial vem de variável de ambiente; nada fica no repositório.
# Valores padrão só para o PostgreSQL local de desenvolvimento.
spring:
  application:
    name: stockeasy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockeasy_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}

stockeasy:
  jwt:
    # Sem valor padrão de propósito: um segredo escrito aqui ficaria público
    # no repositório e permitiria forjar token de qualquer loja. Sem
    # JWT_SECRET no ambiente, o servidor não sobe. Mínimo de 32 caracteres.
    segredo: ${JWT_SECRET}
    validade-horas: ${JWT_HORAS:720}
