# Testes de integração contra o PostgreSQL local, num banco separado.
spring:
  datasource:
    url: ${DB_TEST_URL:jdbc:postgresql://localhost:5432/stockeasy_test}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    clean-disabled: false

stockeasy:
