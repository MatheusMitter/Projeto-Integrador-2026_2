<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockEasy - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mobile-container">
    <div class="content content-centered">
      <!-- Logo -->
      <div class="logo">S</div>
      <div class="logo-text">StockEasy</div>
      <p class="text-gray text-center mb-lg">Controle de Estoque Inteligente</p>
      
      <!-- Formulário de Login -->
      <div style="width: 100%; max-width: 320px;">
        <div class="input-group">
          <label class="input-label">E-mail</label>
          <input type="email" class="input-field" placeholder="seu@email.com" value="">
        </div>
        
        <div class="input-group">
          <label class="input-label">Senha</label>
          <input type="password" class="input-field" placeholder="••••••••" value="">
        </div>
        
        <a href="dashboard.html" class="btn btn-primary">Entrar</a>
        
        <a href="#" class="link">Esqueci minha senha</a>
        <a href="cadastro.html" class="link">Criar nova conta</a>
      </div>
    </div>
  </div>
</body>
</html>
