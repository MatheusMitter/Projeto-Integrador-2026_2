<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockEasy - Login</title>
    <!-- Instalacao na tela inicial do celular: abre em tela cheia, sem
         barra do navegador. Nao altera o comportamento no computador. -->
    <meta name="theme-color" content="#2450d6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="StockEasy" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="mobile-container">
      <main class="content content-centered">
        <div class="auth-panel">
          <!-- Marca alinhada à esquerda, como no Figma. O logo é decorativo:
               o nome do app já está no título logo abaixo. -->
          <div class="logo" aria-hidden="true">SE</div>
          <h1 class="logo-text">StockEasy</h1>
          <p class="text-muted mb-lg">Controle de estoque inteligente</p>

          <!-- Formulário de Login -->
          <!-- Protótipo de interface, sem autenticação real: Entrar leva
               direto ao painel. Os campos ficam vazios e sem "name", como no
               aplicativo, para nenhuma credencial aparecer na página nem na
               barra de endereço. -->
          <form action="dashboard.html" method="get" novalidate>
            <div class="input-group">
              <label class="input-label" for="login-email">E-mail</label>
              <input
                type="email"
                id="login-email"
                class="input-field"
                placeholder="seu@email.com"
                autocomplete="email"
              />
            </div>

            <div class="input-group">
              <label class="input-label" for="login-senha">Senha</label>
              <input
                type="password"
                id="login-senha"
                class="input-field"
                placeholder="••••••••"
                autocomplete="current-password"
              />
            </div>

            <a href="recuperar-senha.html" class="link link-end"
              >Esqueci a senha</a
            >
            <button type="submit" class="btn btn-primary">Entrar</button>
          </form>

          <a href="cadastro.html" class="link">Não tem conta? Criar conta</a>
        </div>
      </main>
    </div>
  </body>
</html>
